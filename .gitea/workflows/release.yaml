name: Release

on:
  workflow_dispatch:
    inputs:
      version_number:
        description: "Версия без префикса v (example: 0.1.0)"
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Проверить версию
        env:
          VERSION: ${{ inputs.version_number }}
        run: |
          if ! echo "${VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Invalid version format: ${VERSION}. Use X.Y.Z"
            exit 1
          fi

      - name: Установить зависимости
        run: apt-get install -y make curl

      - name: Установить Go
        run: |
          GO_VERSION=$(grep '^go ' go.mod | awk '{print $2}')
          curl -fsSL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" -o /tmp/go.tar.gz
          rm -rf /usr/local/go
          tar -C /usr/local -xzf /tmp/go.tar.gz
          echo "/usr/local/go/bin" >> $GITHUB_PATH

      - name: Запустить тесты
        run: go test ./...

      - name: Создать git-тег
        env:
          VERSION: ${{ inputs.version_number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${VERSION}"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/tags/${TAG}")
          if [ "${STATUS}" = "200" ]; then
            echo "Tag ${TAG} already exists"
            exit 1
          fi
          curl -f -X POST \
            -H "Authorization: token ${GITHUB_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${TAG}\",\"message\":\"Release ${TAG}\",\"target\":\"${GITHUB_SHA}\"}" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/tags"

      - name: Собрать бинарник
        run: make build

      - name: Сгенерировать заметки релиза
        env:
          VERSION: ${{ inputs.version_number }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="v${VERSION}"
          PREV_TAG="$(git tag -l "v*" --sort=-v:refname | grep -v "^${TAG}$" | head -n 1 || true)"

          {
            echo "# ${TAG}"
            echo
            if [ -n "${PREV_TAG}" ]; then
              echo "Changes since ${PREV_TAG}:"
              echo
              git log --pretty=format:'- %h %s (%an)' "${PREV_TAG}..HEAD"
            else
              echo "Initial release changes:"
              echo
              git log --pretty=format:'- %h %s (%an)'
            fi
            echo
            echo
            echo "Download:"
            echo "- ${SERVER_URL}/${REPOSITORY}/releases/download/${TAG}/letsencrypt-certificate"
          } > release_notes.txt

      - name: Создать релиз
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ inputs.version_number }}
          body_path: release_notes.txt
          files: |
            letsencrypt-certificate
